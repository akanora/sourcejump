# Weekly pull requests for dependency updates, grouped so each ecosystem is one review. Every new
# dependency still needs a stated benefit (CLAUDE.md); these only move versions of ones already chosen.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /api
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Not supported yet by openapi-typescript or typescript-eslint.
      - dependency-name: typescript
        versions: [">=7"]
      # eslint-config-next's plugins stop at eslint 9.
      - dependency-name: eslint
        versions: [">=10"]
      # Follows the Node major that CI and the servers run, so it moves with Node itself.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
