# Weekly pull requests for dependency updates, grouped so each ecosystem is one review. Every new
# dependency still needs a stated benefit (CLAUDE.md); these only move versions of ones already chosen.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /api
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # openapi-typescript (7.13) accepts only TypeScript 5. Lift this once a release accepts 6; Dependabot won't
      # say when.
      - dependency-name: typescript
        versions: [">=6"]
      # eslint-config-next's plugins stop at eslint 9.
      - dependency-name: eslint
        versions: [">=10"]
      # Follows the Node major that CI and the servers run, so it moves with Node itself.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
