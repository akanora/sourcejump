[package]
name = "sourcejump-viewer-pack-web"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# The packer for the browser: `just wasm` builds it into `web/public/viewer-pack.wasm`.
[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the same revision as the API's, so the browser packs what the API accepts.
sourcejump-viewer-pack = { git = "https://github.com/sourcejump/sourcejump-packer", rev = "fb417acd93dc37d1482b3eb5f46086aeea939d10" }

# The workspace forbids unsafe code; handing bytes across the WebAssembly boundary needs a little, kept to
# this crate.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
